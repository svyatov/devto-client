name: Commit message

# The PR title and body become the squash commit message, and release-please
# reads that message off main to build the changelog. A body line it cannot
# parse makes it drop the whole commit with every job still green, so the check
# belongs here, before the merge, rather than after the entry has gone missing.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # release-please.yml dispatches this on its release PR's branch, for the same
  # reason it dispatches ci.yml. There is no pull_request payload then, so the
  # title and body come from the PR open on that branch.
  workflow_dispatch:

permissions: {}

jobs:
  parseable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # via env, never interpolated into the script: a PR body is written by
      # whoever opened the PR, and `${{ }}` inside `run` is a shell injection
      - if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | bun scripts/check-commit-message.ts
      - if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh pr view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json title,body --jq '"\(.title)\n\n\(.body)"' | bun scripts/check-commit-message.ts
      # ponytail: the PR body only. Every merged PR here is a squash, so the
      # body is the message that reaches release-please. Loop over the branch's
      # own commits too if this repo ever starts merge-committing.
