name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The audit step below is the project's only watcher on 91 of its 97 resolved
  # packages, and an advisory gets published without anyone here pushing. Run
  # the whole thing weekly so a quiet month is not the same as a clean one.
  schedule:
    - cron: "23 5 * * 1"
  # release-please.yml dispatches this on the release PR's branch. That PR is
  # opened by GITHUB_TOKEN, which starts no pull_request runs, and main's ruleset
  # requires these jobs before it merges.
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull-request run tells you nothing, so drop it when a new commit
# arrives. Pushes to main are left alone: that run feeds the CI and coverage
# badges, and cancelling it leaves them reporting a commit that is no longer HEAD.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # GitHub's dependency graph cannot parse bun.lock. Its SBOM lists the six
      # direct devDependencies and nothing under them, so 91 of the 97 resolved
      # packages have no watcher on the forge side at all. `bun audit` reads
      # bun.lock straight against npm's advisory database, which makes this step
      # the only thing covering that residual rather than a second opinion on it.
      # If an unfixable advisory ever walls off every PR, `--ignore <CVE>` is the
      # release valve; nothing here ships to consumers, since the published
      # package has no runtime dependencies.
      - run: bun audit
      - run: bun run build
      - run: bun run check
      - run: bun run check:drift
      - run: bun test --coverage --coverage-reporter=lcov --coverage-reporter=text
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        # Codecov requires an upload token on the default branch even for public
        # repos. Add it once: `gh secret set CODECOV_TOKEN` with the value from
        # the repo's page on codecov.io.

  # The package ships for Node consumers, but the suite runs under Bun. Pack the
  # tarball and import it by name, so a Node-only regression or a packaging
  # mistake (a wrong `exports` map, a file missing from `files`) fails a PR here
  # instead of surfacing at release. `engines.node` says >=22.12, which is a
  # promise about every maintained line at or above it, not just the floor, so
  # each one gets a leg. Bun-side gates stay in the job above and run once.
  node-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.12", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: |
          npm pack
          cd "$(mktemp -d)"
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE"/devto-client-*.tgz >/dev/null 2>&1
          node -e "import('devto-client').then(m => { if (!m.DevToClient) throw new Error('missing DevToClient export'); })"
