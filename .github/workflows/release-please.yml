name: release-please

on:
  push:
    branches: [main]

# Deny by default. The repository default is write-all, so a job added here
# without its own permissions block would inherit it, and this is the file the
# npm trusted publisher is pinned to by filename.
permissions: {}

# Tag creation, the GitHub release, and the npm publish are all one-way. Two runs
# racing them can publish a version whose bytes disagree with its tag.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      pr_branch: ${{ steps.release.outputs.prs_created == 'true' && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
    steps:
      # Manifest mode, not the config-less `release-type: node` this used to run.
      # The config file is what carries `extra-files`, which is how src/version.ts
      # gets bumped in lockstep with package.json.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release PR is opened and pushed by GITHUB_TOKEN, which starts no
  # pull_request runs, so main's required checks never report on it and the
  # merge stays blocked. workflow_dispatch is the one event that token can still
  # start, and a dispatched run reports its checks on the branch head, which is
  # the PR head. A job of its own keeps `actions: write` away from the
  # third-party action above.
  dispatch-checks:
    needs: release-please
    if: needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ needs.release-please.outputs.pr_branch }}
    steps:
      - run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run commit-message.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  # Everything that runs third-party code lives here, in a job with no publish
  # identity. A release created by GITHUB_TOKEN starts no new workflow runs, so
  # publishing has to happen in this workflow rather than on a release trigger.
  verify:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # attw packs the tarball with npm, and the smoke check below runs under
      # node. Pin both to the package's minimum supported Node rather than
      # whatever the runner image happens to ship.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.12"
      - run: bun install --frozen-lockfile
      # The same gates ci.yml runs on a PR. They are repeated here because no
      # branch rule requires CI to be green before a merge, so this job is the
      # only thing standing between main and an immutable npm version.
      - run: bun run check
      - run: bun run check:drift
      - run: bun test
      # publish runs with --ignore-scripts, so prepublishOnly never fires there.
      # Running it here keeps one definition of the packaging gates: it builds
      # dist/ and runs publint and attw against it.
      - run: bun run prepublishOnly
      # publint and attw check the packaging, not that the thing imports. Without
      # this, an empty or broken dist/ publishes green, and npm versions are
      # immutable, so there is no taking it back.
      - run: node --input-type=module -e "import('./dist/index.js').then(m => { if (!m.DevToClient) throw new Error('built dist is missing DevToClient') })"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The last moment a wrong version or a bad artifact can be stopped. An npm
    # version is immutable, so everything after this job is permanent. The
    # `release` environment carries a required reviewer, which holds the run
    # here until someone approves it. Self-approval is allowed on purpose: at
    # one maintainer, prevent-self-review would be a deadlock rather than a
    # gate, and the pause is what the rule is actually asking for.
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC provenance)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
      # Publishing shells to npm rather than bun because OIDC trusted publishing
      # needs npm >= 11.5.1.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Pinned, not `npm@latest`: this is the one third-party package fetched in
      # the job that can mint an OIDC token, and a floating tag resolves fresh on
      # every release. Bump it deliberately; any version >= 11.5.1 works.
      - run: npm install -g npm@12.0.1
      # Nothing else runs here. No project dependencies are installed, and
      # --ignore-scripts keeps this package's own prepublishOnly from firing:
      # it already ran in verify, and re-running it would put the build back
      # inside the job holding the token.
      - run: npm publish --ignore-scripts
