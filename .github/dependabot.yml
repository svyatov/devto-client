version: 2
updates:
  # Declared `bun` and not `npm`. The toolchain writes bun.lock and no package-lock.json, and
  # the npm ecosystem cannot read bun.lock, so the previous `npm` entry could only edit
  # package.json. Every dependency here is declared with a caret range that already admits
  # the current release, so that entry had nothing it was able to change and opened no pull
  # request in the life of the repository.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
